AWSTemplateFormatVersion: '2010-09-09'
Description: Security groups and IAM resources for the AWS Networking Lab

Parameters:
  EnvironmentName:
    Type: String
    Default: networking-lab
    Description: Name used to identify project resources


Resources:
  # ALB Security Group
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP and HTTPS traffic to the ALB
      GroupName: !Sub '${EnvironmentName}-alb-sg'
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VPCId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'

  # EC2 Security Group
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the ALB only
      GroupName: !Sub '${EnvironmentName}-web-sg'
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VPCId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-sg'

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ec2-role'
      Description: Allows EC2 instances to use AWS Systems Manager
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-ec2-profile'
      Roles:
        - !Ref EC2Role
  

Outputs:
  ALBSecurityGroupId:
    Description: ID of the ALB security group
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-ALBSecurityGroupId'

  WebServerSecurityGroupId:
    Description: ID of the web server security group
    Value: !Ref WebServerSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-WebServerSecurityGroupId'

  InstanceProfileName:
    Description: Name of the EC2 instance profile
    Value: !Ref EC2InstanceProfile
    Export:
      Name: !Sub '${EnvironmentName}-InstanceProfileName'
  
  RoleArn:
    Description: ARN of the EC2 IAM role
    Value: !GetAtt EC2Role.Arn
    Export:
      Name: !Sub '${EnvironmentName}-EC2RoleArn'
