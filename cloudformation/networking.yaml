AWSTemplateFormatVersion: '2010-09-09'
Description: Networking infrastructure for the AWS Networking Lab

Parameters:
    EnvironmentName:
        Type: String
        Default: networking-lab
        Description: Name used to identify project resources

Resources:
    LabVPC:
        Type: AWS::EC2::VPC
        Properties:
            CidrBlock: 10.0.0.0/16
            EnableDnsSupport: true
            EnableDnsHostnames: true
            Tags:
                - Key: Name
                  Value: !Sub '${EnvironmentName}-vpc'
    
    LabSubnet:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref LabVPC
        CidrBlock: 10.0.1.0/24
        MapPublicIpOnLaunch: true
        AvailabilityZone: !Select
          - 0
          - !GetAZs ''
        Tags:
          - Key: Name
            Value: !Sub '${EnvironmentName}-public-subnet'
    
    LabInternetGateway:
      Type: AWS::EC2::InternetGateway
      Properties:
        Tags:
          - Key: Name
            Value: !Sub '${EnvironmentName}-igw'
    
    LabInternetGatewayAttachment:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        VpcId: !Ref LabVPC
        InternetGatewayId: !Ref LabInternetGateway

    LabRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref LabVPC
        Tags:
          - Key: Name
            Value: !Sub '${EnvironmentName}-public-rt'
    
    LabDefaultRoute:
      Type: AWS::EC2::Route
      DependsOn: LabInternetGatewayAttachment
      Properties:
        RouteTableId: !Ref LabRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        GatewayId: !Ref LabInternetGateway

    LabSubnetRouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref LabSubnet
        RouteTableId: !Ref LabRouteTable


Outputs:
  VpcId:
    Description: ID of the networking lab VPC
    Value: !Ref LabVPC
    Export:
      Name: !Sub '${EnvironmentName}-VPCId'

  SubnetId:
    Description: ID of the public subnet
    Value: !Ref LabSubnet
    Export:
      Name: !Sub '${EnvironmentName}-SubnetId'
  
  InternetGatewayId:
    Description: ID of the Internet Gateway
    Value: !Ref LabInternetGateway
  
  RouteTableId:
    Description: ID of the public route table
    Value: !Ref LabRouteTable
